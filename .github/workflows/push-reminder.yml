name: Push Reminder Scheduler

on:
  schedule:
    # 매 2시간마다 실행 (UTC 기준)
    - cron: '0 */1 * * *'

jobs:
  send_push:
    runs-on: ubuntu-latest
    steps:
      - name: Ping to wake up server
        run: |
          echo "Pinging health check endpoint..."
          curl --retry 5 --retry-delay 5 --max-time 30 https://your-service-name.onrender.com/api/healthz
          
      - name: Call push reminder API
        run: |
          curl -X POST https://your-service-name.onrender.com/api/push/reminder
